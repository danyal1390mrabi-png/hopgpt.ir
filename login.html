<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ورود | {S}</title>
<link rel="icon" type="image/png" href="img/favicon.png"><link rel="apple-touch-icon" href="img/icon-192.png"><link rel="stylesheet" href="css/base.css">
<style>
  html,body{min-height:100%}
  body{display:flex;overflow-x:hidden;overflow-y:auto;perspective:1400px;padding:28px 0 56px}
  .stage{margin:auto}

  /* ---------- پس‌زمینهٔ سه‌بعدی ---------- */
  #sphere{position:fixed;left:50%;top:50%;width:min(130vmin,980px);height:min(130vmin,980px);transform:translate(-50%,-50%);opacity:.38;pointer-events:none;z-index:0}
  .orb{position:fixed;border-radius:50%;filter:blur(2px);pointer-events:none;z-index:1;transition:transform .25s ease-out;
       background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.75),var(--ac) 38%,var(--ac2) 78%,transparent 80%);
       box-shadow:0 30px 50px -18px var(--sh),inset 0 -10px 22px rgba(0,0,0,.35)}
  .orb.a{width:90px;height:90px;top:12%;right:12%;animation:float 7s ease-in-out infinite}
  .orb.b{width:56px;height:56px;bottom:14%;left:14%;animation:float 9s ease-in-out -3s infinite;opacity:.85}
  .orb.c{width:34px;height:34px;top:26%;left:22%;animation:float 6s ease-in-out -1.5s infinite;opacity:.7}
  .orb.d{width:44px;height:44px;bottom:22%;right:20%;animation:float 8s ease-in-out -5s infinite;opacity:.75}
  @keyframes float{0%,100%{translate:0 0}50%{translate:0 -16px}}

  /* ---------- کارت ---------- */
  .stage{position:relative;z-index:2;width:min(400px,92vw);transform-style:preserve-3d}
  .tilt{transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease}
  .logo3d{display:block;margin:0 auto -46px;width:104px;height:104px;border-radius:28px;position:relative;z-index:3;
          transform:translateZ(70px);filter:drop-shadow(0 22px 22px var(--sh));animation:bob 5s ease-in-out infinite}
  @keyframes bob{0%,100%{translate:0 0}50%{translate:0 -8px}}

  .faces{display:grid;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.2,.8,.2,1)}
  .stage.signup .faces{transform:rotateY(180deg)}
  .face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:62px 26px 26px;border-radius:24px;
        background:linear-gradient(145deg,var(--hi),transparent 46%),var(--card);border:1px solid var(--line);
        box-shadow:0 40px 60px -28px var(--sh),0 3px 0 rgba(0,0,0,.2),inset 0 1px 0 var(--hi)}
  .face.back{transform:rotateY(180deg)}
  .face{transition:visibility 0s .4s}
  /* بعد از پایان چرخش، کارت «تخت» می‌شود تا کلیک‌ها در حالت کج‌شدن هم درست کار کنند */
  .stage.noanim .faces{transition:none}
  .stage.flat .faces{transition:none;transform:none}
  .stage.flat .face.back{transform:none}
  .stage.flat .face.front{display:none}
  .stage:not(.signup) .face.back,.stage.signup .face.front{visibility:hidden;pointer-events:none}
  .face h1{margin:0 0 4px;font-size:22px;text-align:center;transform:translateZ(30px)}
  .face h1 span{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .face p.sub{margin:0 0 16px;text-align:center;color:var(--mu);font-size:13.5px}
  .face label{display:block;font-size:12.5px;color:var(--mu);margin:12px 4px 6px}
  .field{position:relative;transform:translateZ(18px)}
  .field input{width:100%;padding:12px 14px;border-radius:13px;border:1px solid var(--line);background:var(--code);color:var(--tx);font:inherit;font-size:15px;
               direction:ltr;text-align:left;box-shadow:inset 0 3px 8px rgba(0,0,0,.35);transition:border-color .15s,box-shadow .15s}
  .field input:focus{outline:0;border-color:var(--ac);box-shadow:inset 0 3px 8px rgba(0,0,0,.35),0 0 0 3px color-mix(in srgb,var(--ac) 30%,transparent)}
  .field .eye{position:absolute;top:50%;right:10px;transform:translateY(-50%);background:none;border:0;font-size:16px;opacity:.7;padding:4px}
  .field.pw input{padding-right:40px}
  .go{width:100%;margin-top:20px;transform:translateZ(26px)}
  .go:disabled{opacity:.65;cursor:wait}
  .err{min-height:22px;margin-top:12px;color:#ff7b7b;font-size:13px;text-align:center}
  .err.shake{animation:shake .4s}
  @keyframes shake{20%,60%{translate:-6px 0}40%,80%{translate:6px 0}}
  .swap{text-align:center;margin-top:6px;font-size:13.5px;color:var(--mu)}
  .swap{margin-top:14px}
  .swap .btn{display:block;width:100%;margin-top:8px;transform:translateZ(20px);touch-action:manipulation}
  .btn,.eye{touch-action:manipulation}
  .credit{position:fixed;bottom:6px;left:0;right:0;z-index:2;pointer-events:none}.credit a{pointer-events:auto}
  @media (max-height:640px){.credit{display:none}.logo3d{width:80px;height:80px;margin-bottom:-36px}.face{padding-top:48px}}
</style>
</head><body>
<canvas id="sphere"></canvas>
<i class="orb a" data-z="1.6"></i><i class="orb b" data-z="1"></i><i class="orb c" data-z="2.2"></i><i class="orb d" data-z="1.3"></i>

<div class="stage" id="stage">
  <div class="tilt" id="tilt">
    <img class="logo3d" src="img/logo-512.png" alt="HopGPT">
    <div class="faces">

      <section class="face front">
        <h1>خوش آمدی به <span data-site></span></h1>
        <p class="sub">برای ورود، حساب خودت را وارد کن.</p>
        <label for="lu">نام کاربری</label>
        <div class="field"><input id="lu" autocomplete="username" autocapitalize="none" spellcheck="false"></div>
        <label for="lp">رمز عبور</label>
        <div class="field pw"><input id="lp" type="password" autocomplete="current-password"><button class="eye" type="button" data-eye="lp" aria-label="نمایش رمز">👁</button></div>
        <button class="btn go" id="goLogin" type="button">ورود</button>
        <div class="err" id="errLogin"></div>
        <div class="swap">حساب نداری؟<button class="btn ghost sm" type="button" id="toSignup">ثبت‌نام</button></div>
      </section>

      <section class="face back">
        <h1>ساخت حساب در <span data-site></span></h1>
        <p class="sub">یک نام کاربری و رمز عبور انتخاب کن.</p>
        <label for="su">نام کاربری (۳ تا ۳۰ حرف یا عدد)</label>
        <div class="field"><input id="su" autocomplete="username" autocapitalize="none" spellcheck="false"></div>
        <label for="sp">رمز عبور (حداقل ۸ کاراکتر)</label>
        <div class="field pw"><input id="sp" type="password" autocomplete="new-password"><button class="eye" type="button" data-eye="sp" aria-label="نمایش رمز">👁</button></div>
        <label for="sp2">تکرار رمز عبور</label>
        <div class="field pw"><input id="sp2" type="password" autocomplete="new-password"><button class="eye" type="button" data-eye="sp2" aria-label="نمایش رمز">👁</button></div>
        <button class="btn go" id="goSignup" type="button">ساخت حساب</button>
        <div class="err" id="errSignup"></div>
        <div class="swap">قبلاً ثبت‌نام کرده‌ای؟<button class="btn ghost sm" type="button" id="toLogin">بازگشت به ورود</button></div>
      </section>

    </div>
  </div>
</div>
<div class="credit">ساخته شده توسط <a href="https://danyalcode.ir" target="_blank" rel="noopener">دانیال کد</a> · danyalcode.ir</div>

<script src="js/config.js"></script><script src="js/common.js"></script><script src="js/sphere.js"></script>
<script>
(function(){
  const NEXT = "index.html";
  const stage = $("stage");

  // اگر توکن معتبر دارد، مستقیم وارد شود
  const old = localStorage.getItem("hop_token");
  if (old) fetch(API + "/web/me", { headers: { authorization: "Bearer " + old } })
    .then(r => { if (r.ok) location.replace(NEXT); else { localStorage.removeItem("hop_token"); localStorage.removeItem("hop_user"); } })
    .catch(() => {});

  // چرخش سه‌بعدی کارت بین ورود و ثبت‌نام
  let flatT;
  function mode(m){
    clearTimeout(flatT);
    if (m === "signup") {
      stage.classList.add("signup");
      flatT = setTimeout(() => stage.classList.add("flat"), 950);
    } else {
      stage.classList.add("noanim"); stage.classList.remove("flat"); void stage.offsetWidth;
      stage.classList.remove("noanim"); stage.classList.remove("signup");
    }
    $("errLogin").textContent = $("errSignup").textContent = "";
    setTimeout(() => $(m === "signup" ? "su" : "lu").focus(), 450);
  }
  $("toSignup").onclick = () => mode("signup");
  $("toLogin").onclick = () => mode("login");

  // نمایش/پنهان کردن رمز
  document.querySelectorAll("[data-eye]").forEach(b => b.onclick = () => {
    const i = $(b.dataset.eye); i.type = i.type === "password" ? "text" : "password";
  });

  function fail(id, msg){
    const e = $(id); e.textContent = msg; e.classList.remove("shake"); void e.offsetWidth; e.classList.add("shake");
  }

  async function submit(kind){
    const isLogin = kind === "login";
    const user = $(isLogin ? "lu" : "su").value, pass = $(isLogin ? "lp" : "sp").value;
    const errId = isLogin ? "errLogin" : "errSignup", btn = $(isLogin ? "goLogin" : "goSignup");
    if (!isLogin && pass !== $("sp2").value) return fail(errId, "رمزها یکسان نیستند.");
    btn.disabled = true; $(errId).textContent = "";
    try {
      const r = await fetch(API + "/web/" + kind, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ username: user, password: pass }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || !d.token) return fail(errId, d.error || "خطا در ارتباط با سرور.");
      localStorage.setItem("hop_token", d.token); localStorage.setItem("hop_user", d.user);
      location.replace(NEXT);
    } catch (e) {
      fail(errId, "اتصال به سرور برقرار نشد.");
    } finally { btn.disabled = false; }
  }
  $("goLogin").onclick = () => submit("login");
  $("goSignup").onclick = () => submit("signup");
  ["lu","lp"].forEach(i => $(i).addEventListener("keydown", e => { if (e.key === "Enter") submit("login"); }));
  ["su","sp","sp2"].forEach(i => $(i).addEventListener("keydown", e => { if (e.key === "Enter") submit("signup"); }));

  // اثر عمق: کارت با ماوس کج می‌شود و گوی‌ها با سرعت‌های متفاوت حرکت می‌کنند
  const tl = $("tilt"), orbs = document.querySelectorAll(".orb");
  addEventListener("pointermove", e => {
    const x = e.clientX / innerWidth - .5, y = e.clientY / innerHeight - .5;
    tl.style.setProperty("--ry", (x * 14) + "deg"); tl.style.setProperty("--rx", (-y * 14) + "deg");
    orbs.forEach(o => { const z = +o.dataset.z; o.style.transform = "translate(" + (-x * 40 * z) + "px," + (-y * 40 * z) + "px)"; });
  });
  document.addEventListener("pointerleave", () => { tl.style.setProperty("--rx", "0deg"); tl.style.setProperty("--ry", "0deg"); });
})();
</script>
</body></html>
